name: Release TikZ WASM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install TeX Live Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-pictures \
            texlive-latex-extra \
            texlive-binaries

      - name: Install NPM Dependencies
        run: npm ci

      - name: Fetch Upstream WASM
        run: npx tsx scripts/setup.ts

      - name: Detect TeX Root
        id: texroot
        run: |
          TEX_DIST=$(kpsewhich -var-value=TEXMFDIST)
          echo "tex_dist=$TEX_DIST" >> $GITHUB_OUTPUT

      - name: Generate tikz.fmt
        run: npx tsx scripts/build_fmt.ts "${{ steps.texroot.outputs.tex_dist }}"

      - name: Run Tests
        run: npm test

      - name: Build Bundle
        run: npm run build

      # Create the tarball and capture the filename
      - name: Pack to TGZ
        id: pack
        run: |
          PACK_NAME=$(npm pack)
          echo "tarball_name=$PACK_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release Assets (GitHub)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.pack.outputs.tarball_name }}
            dist/*
            src/assets/tex.wasm
            src/assets/tikz.fmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the specific tarball created above to avoid rebuilding
      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish "${{ steps.pack.outputs.tarball_name }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
